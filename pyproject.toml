[project]
name = "ubible-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SaelKimberly", email = "sael.kimberly@yandex.ru" }
]
requires-python = ">=3.14.6"
dependencies = [
    "aiohttp>=3.14.3",
    "loguru>=0.7.3",
    "msgspec>=0.21.1",
    "orjson>=3.11.9",
    "requests>=2.34.2",
]

[project.scripts]
ubible-mcp = "ubible_mcp:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ptipython>=1.0.1",
]
